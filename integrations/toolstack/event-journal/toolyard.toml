# Operator installs this descriptor with the actual EXISTING Docket API port.
# No new workload process, read operation, SPS secret or admin capability.
id = "docket"
type = "api"

[entrypoint]
port = 8768

[[operations]]
name = "record"
description = "Record one bounded event summary in Docket's private outcome journal"
risk = "write"

[[operations.args]]
name = "source"
type = "string"
description = "Installed journal source identifier; never event-selected"
required = true

[[operations.args]]
name = "text"
type = "string"
description = "Reviewed plain event summary data; never interpreted"
required = true
maxLength = 512
