[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "docket"
version = "0.3.0"
description = "Local schedule service that wakes an agent session."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
docket = "docket.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["docket"]
